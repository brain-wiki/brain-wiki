name: Release

# Push a tag vX.Y.Z (or vX.Y.Z.devN) whose version matches pyproject.toml and has a dated
# CHANGELOG entry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: The tag matches the version and the changelog
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          grep -Eq "^## $version \([0-9]{4}-[0-9]{2}-[0-9]{2}\)" CHANGELOG.md || { echo "CHANGELOG.md has no dated entry for $version"; exit 1; }
          if echo "$version" | grep -Eq '(a|b|rc|\.dev)[0-9]+$'; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - run: uv sync
      - run: uv run scripts/check.py
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Listing in the MCP Registry, a public catalog, is off until the project decides to be listed
  # (13 §9). To turn it on, delete `false && `; development releases stay out either way.
  mcp-registry:
    needs: [build, pypi]
    if: false && needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # MCP Registry login with GitHub OIDC
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release with this version's changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" 'index($0, "## " v " (") == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          flag=$(test "$PRERELEASE" = true && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md $flag
