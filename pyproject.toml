[project]
name = "brain-wiki"
version = "0.1.0.dev0"
description = "A local-first second brain for AI agents, kept as plain Markdown that you own."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "brain-wiki contributors" }]
keywords = ["memory", "agents", "mcp", "markdown", "obsidian", "knowledge-base"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "mcp>=2.3,<3",
  "PyYAML>=6.0",
  "tomlkit>=0.12",
  "filelock>=3.12",
  "jsonschema>=4.20",
]

[project.urls]
Homepage = "https://github.com/brain-wiki/brain-wiki"
Documentation = "https://github.com/brain-wiki/brain-wiki/tree/main/docs/user"
Repository = "https://github.com/brain-wiki/brain-wiki"
Issues = "https://github.com/brain-wiki/brain-wiki/issues"
Changelog = "https://github.com/brain-wiki/brain-wiki/blob/main/CHANGELOG.md"

[project.scripts]
brain = "brainwiki.cli.main:main"
brain-wiki = "brainwiki.cli.main:main"
brain-wiki-mcp = "brainwiki.mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff==0.16.10"]  # ruff exact: formatting changes between releases

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brainwiki"]

# The repository root is the plugin; ship the same files so `brain connect` installs what
# the marketplaces serve (design doc 13 §4).
[tool.hatch.build.targets.wheel.force-include]
"plugin.json" = "brainwiki/assets/plugin/plugin.json"
"mcp.json" = "brainwiki/assets/plugin/mcp.json"
".mcp.json" = "brainwiki/assets/plugin/.mcp.json"
"mcp_config.json" = "brainwiki/assets/plugin/mcp_config.json"
"server.json" = "brainwiki/assets/plugin/server.json"
".claude-plugin" = "brainwiki/assets/plugin/.claude-plugin"
"rules" = "brainwiki/assets/plugin/rules"
"skills" = "brainwiki/assets/plugin/skills"

# An allowlist, so local drafts and caches never reach the sdist.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts",
  "/skills",
  "/rules",
  "/.claude-plugin",
  "/plugin.json",
  "/mcp.json",
  "/.mcp.json",
  "/mcp_config.json",
  "/server.json",
  "/.pre-commit-hooks.yaml",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tests import shared helpers as `tests.conftest`
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S603", "S607", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
pythonVersion = "3.11"
